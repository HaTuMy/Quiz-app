{% extends "base.html" %}

{% block title %}Không Tìm Thấy Trang{% endblock %}

{% block content %}
<style>
.error-container {
    max-width: 800px;
    margin: 4rem auto;
    padding: 3rem;
    text-align: center;
    background: white;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
}

.error-icon {
    font-size: 5rem;
    color: #3498db;
    margin-bottom: 2rem;
}

.error-code {
    font-size: 8rem;
    font-weight: bold;
    color: #3498db;
    margin-bottom: 1rem;
    line-height: 1;
}

.error-title {
    font-size: 2.5rem;
    color: #2c3e50;
    margin-bottom: 1.5rem;
}

.error-message {
    font-size: 1.2rem;
    color: #6c757d;
    margin-bottom: 2rem;
    line-height: 1.6;
}

.btn-home {
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    color: white;
    background: linear-gradient(135deg, #3498db, #2980b9);
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.3s ease;
}

.btn-home:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(52, 152, 219, 0.4);
}
</style>

<div class="error-container">
    <i class="fas fa-search error-icon"></i>
    <div class="error-code">404</div>
    <h1 class="error-title">Không Tìm Thấy Trang</h1>
    <p class="error-message">
        Xin lỗi, trang bạn đang tìm kiếm không tồn tại hoặc đã bị di chuyển.<br>
        Vui lòng kiểm tra lại đường dẫn hoặc quay về trang chủ.
    </p>
    <a href="{{ url_for('home') }}" class="btn-home">
        <i class="fas fa-home"></i> Về Trang Chủ
    </a>
</div>
{% endblock %}
