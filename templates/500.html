{% extends "base.html" %}

{% block title %}Lỗi Máy Chủ{% endblock %}

{% block content %}
<style>
.error-container {
    max-width: 800px;
    margin: 4rem auto;
    padding: 3rem;
    text-align: center;
    background: white;
    border-radius: 15px;
    box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
}

.error-icon {
    font-size: 5rem;
    color: #dc3545;
    margin-bottom: 2rem;
}

.error-title {
    font-size: 2.5rem;
    color: #2c3e50;
    margin-bottom: 1.5rem;
}

.error-message {
    font-size: 1.2rem;
    color: #6c757d;
    margin-bottom: 2rem;
    line-height: 1.6;
}

.btn-home {
    display: inline-flex;
    align-items: center;
    gap: 0.8rem;
    padding: 1rem 2rem;
    font-size: 1.1rem;
    color: white;
    background: linear-gradient(135deg, #4CAF50, #45a049);
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.3s ease;
}

.btn-home:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(76, 175, 80, 0.4);
}
</style>

<div class="error-container">
    <i class="fas fa-exclamation-triangle error-icon"></i>
    <h1 class="error-title">Lỗi Máy Chủ</h1>
    <p class="error-message">
        Xin lỗi, đã có lỗi xảy ra từ phía máy chủ.<br>
        Vui lòng thử lại sau hoặc liên hệ với quản trị viên nếu lỗi vẫn tiếp tục.
    </p>
    <a href="{{ url_for('home') }}" class="btn-home">
        <i class="fas fa-home"></i> Về Trang Chủ
    </a>
</div>
{% endblock %}
