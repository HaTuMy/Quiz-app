{% extends "base.html" %}

{% block title %}Đăng nhập{% endblock %}

{% block content %}
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

        // Firebase config
        const firebaseConfig = {
            apiKey: "AIzaSyCpOyeHm6P9B4r9KGT_RR37uTyqVu7audw",
            authDomain: "math-quiz-151e5.firebaseapp.com",
            projectId: "math-quiz-151e5",
            storageBucket: "math-quiz-151e5.appspot.com",
            messagingSenderId: "652820121524",
            appId: "1:652820121524:web:57725ea5078cfb80dc14e1",
            measurementId: "G-7QVNLWSSQV"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Google login
        function googleLogin() {
            const provider = new GoogleAuthProvider();
        
            // Bắt buộc Google hiển thị chọn tài khoản mỗi lần
            provider.setCustomParameters({
                prompt: 'select_account'
            });
        
            signInWithPopup(auth, provider)
                .then(async (result) => {
                    const user = result.user;
                    const idToken = await user.getIdToken();  
                    console.log("Token lấy được:", idToken);
                
                    const response = await fetch('/login/google', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ idToken: idToken }),
                    });
                
                    if (response.ok) {
                        alert('Đăng nhập thành công!');
                        window.location.href = '/home';
                    } else {
                        const errorData = await response.json();
                        alert('Đăng nhập thất bại: ' + (errorData.message || 'Lỗi không xác định'));
                    }
                })
                .catch((error) => {
                    console.error("Error during Google login:", error.message);
                    alert("Đăng nhập thất bại: " + error.message);
                });
        }
        
        

        // Gán hàm googleLogin cho window để HTML có thể gọi
        window.googleLogin = googleLogin;
    </script>
    
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <i class="fas fa-user-circle"></i>
                <h2>Đăng nhập</h2>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="alert alert-{{ messages[0][0] }}">
                        <i class="fas fa-info-circle"></i>
                        {{ messages[0][1] }}
                    </div>
                {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="form-group">
                    <label for="email"><i class="fas fa-envelope"></i> Email</label>
                    <div class="input-group">
                        <input type="email" id="email" name="email" required placeholder="Nhập email của bạn">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password"><i class="fas fa-lock"></i> Mật khẩu</label>
                    <div class="input-group">
                        <input type="password" id="password" name="password" required placeholder="Nhập mật khẩu">
                    </div>
                </div>

                <button type="submit" class="btn-auth">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập
                </button>
            </form>

            <div class="divider">
                <span>hoặc</span>
            </div>

            <button onclick="googleLogin()" class="btn-google">
                <img src="https://www.google.com/favicon.ico" alt="Google">
                Đăng nhập với Google
            </button>

            <div class="auth-footer">
                <p>Chưa có tài khoản? <a href="{{ url_for('register') }}"><i class="fas fa-user-plus"></i> Đăng ký</a></p>
                <p><a href="{{ url_for('forgot_password') }}"><i class="fas fa-key"></i> Quên mật khẩu?</a></p>
            </div>
        </div>
    </div>

    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            margin-top: -60px;
        }
        .auth-box {
            width: 100%;
            max-width: 400px;
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-header i {
            font-size: 3rem;
            color: #667eea;
            margin-bottom: 1rem;
        }
        .auth-header h2 {
            color: #2d3748;
            font-size: 1.8rem;
            font-weight: 600;
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            color: #4a5568;
            font-size: 0.95rem;
        }
        .form-group label i {
            color: #667eea;
        }
        .input-group {
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            outline: none;
        }
        .btn-auth {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-auth:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-google {
            width: 100%;
            padding: 1rem;
            background-color: #4285F4;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }
        .btn-google i {
            font-size: 1.2rem;
        }
        .btn-google:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(66, 133, 244, 0.4);
        }
        .auth-footer {
            text-align: center;
            margin-top: 2rem;
            color: #718096;
        }
        .auth-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        .auth-footer a:hover {
            text-decoration: underline;
        }
        .alert {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            border-radius: 12px;
            font-size: 0.95rem;
        }
        .alert-error {
            background-color: #fff5f5;
            color: #c53030;
            border: 1px solid #feb2b2;
        }
        .alert-success {
            background-color: #f0fff4;
            color: #2f855a;
            border: 1px solid #9ae6b4;
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }
        
        .divider span {
            padding: 0 1rem;
            color: #718096;
            font-size: 0.875rem;
        }
    </style>
{% endblock %}
